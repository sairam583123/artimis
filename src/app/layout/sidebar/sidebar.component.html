<!-- ===== MOBILE TOP BAR ===== -->
<header class="fixed inset-x-0 top-0 z-40 flex h-16 items-center justify-between bg-brand-900 px-4 shadow-lg lg:hidden">
  <a routerLink="/" (click)="close()" class="flex items-center gap-2">
    <img src="logo.jpg" alt="Artimis logo" class="h-11 w-auto object-contain">
  </a>
  <button
    (click)="toggle()"
    class="flex h-10 w-10 items-center justify-center rounded-lg text-white/90 transition hover:bg-white/10"
    aria-label="Toggle menu"
  >
    <app-icon [name]="isOpen() ? 'close' : 'menu'" klass="w-6 h-6"></app-icon>
  </button>
</header>

<!-- ===== MOBILE BACKDROP ===== -->
<div
  *ngIf="isOpen()"
  (click)="close()"
  class="fixed inset-0 z-30 bg-black/50 backdrop-blur-sm lg:hidden"
></div>

<!-- ===== SIDEBAR (desktop fixed / mobile drawer) ===== -->
<aside
  class="fixed inset-y-0 left-0 z-40 flex w-[280px] flex-col bg-gradient-to-b from-brand-950 via-brand-900 to-brand-950 transition-transform duration-300 ease-in-out lg:translate-x-0"
  [class.-translate-x-full]="!isOpen()"
  [class.translate-x-0]="isOpen()"
>
  <!-- Logo -->
  <div class="flex items-center justify-center px-6 py-5">
    <div class="rounded-xl bg-white p-2.5 shadow-md">
      <img src="logo.jpg" alt="Artimis logo" class="h-11 w-auto object-contain">
    </div>
  </div>

  <!-- Nav -->
  <nav class="sidebar-scroll flex-1 overflow-y-auto px-4 py-4">
    <ul class="space-y-1">
      <li>
        <a
          routerLink="/"
          routerLinkActive="bg-white/10 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="close()"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold text-white/70 transition hover:bg-white/5 hover:text-white"
        >
          <app-icon name="droplet" klass="w-5 h-5"></app-icon>
          Home
        </a>
      </li>
      <li>
        <a
          routerLink="/about"
          routerLinkActive="bg-white/10 text-white"
          (click)="close()"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold text-white/70 transition hover:bg-white/5 hover:text-white"
        >
          <app-icon name="shield" klass="w-5 h-5"></app-icon>
          About Us
        </a>
      </li>

      <!-- Products (expandable) -->
      <li>
        <button
          (click)="productsOpen.set(!productsOpen())"
          class="flex w-full items-center justify-between gap-3 rounded-xl px-4 py-3 text-sm font-semibold text-white/70 transition hover:bg-white/5 hover:text-white"
        >
          <span class="flex items-center gap-3">
            <app-icon name="faucet" klass="w-5 h-5"></app-icon>
            Products
          </span>
          <app-icon name="chevron-right" klass="w-4 h-4 transition-transform" [class.rotate-90]="productsOpen()"></app-icon>
        </button>
        <ul *ngIf="productsOpen()" class="ml-4 mt-1 space-y-0.5 border-l border-white/10 pl-4">
          <li>
            <a
              routerLink="/products"
              routerLinkActive="text-brass-400"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="close()"
              class="block rounded-lg px-3 py-2 text-sm text-white/60 transition hover:text-white"
            >
              All Categories
            </a>
          </li>
          <li *ngFor="let cat of categories">
            <a
              [routerLink]="['/products', cat.slug]"
              routerLinkActive="text-brass-400"
              (click)="close()"
              class="block rounded-lg px-3 py-2 text-sm text-white/60 transition hover:text-white"
            >
              {{ cat.shortName }}
            </a>
          </li>
        </ul>
      </li>

      <li>
        <a
          routerLink="/gallery"
          routerLinkActive="bg-white/10 text-white"
          (click)="close()"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold text-white/70 transition hover:bg-white/5 hover:text-white"
        >
          <app-icon name="award" klass="w-5 h-5"></app-icon>
          Gallery
        </a>
      </li>
      <li>
        <a
          routerLink="/contact"
          routerLinkActive="bg-white/10 text-white"
          (click)="close()"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold text-white/70 transition hover:bg-white/5 hover:text-white"
        >
          <app-icon name="mail" klass="w-5 h-5"></app-icon>
          Contact
        </a>
      </li>
    </ul>
  </nav>

  <!-- Bottom contact card -->
  <div class="m-4 rounded-2xl bg-white/5 p-4">
    <p class="mb-2 flex items-center gap-2 text-xs font-semibold text-white/60">
      <app-icon name="phone" klass="w-4 h-4 text-brass-400"></app-icon>
      Toll-Free
    </p>
    <p class="mb-3 text-sm font-bold text-white">1800 1200 171</p>
    <a routerLink="/contact" (click)="close()" class="btn-primary w-full !py-2.5 text-sm">Get a Quote</a>
  </div>
</aside>
